version: "3.8"

# =============================================================================
# CREDENTIALS: Never commit real passwords. All secrets come from your shell
# environment or a .env file that is .gitignored.  Production must provide
# every SECRET_* variable below or the backend will refuse to start.
# =============================================================================

services:
  # PostgreSQL Persistent Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: secure-graphrag-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"   # bind to localhost only — not exposed to WAN
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphrag}
      POSTGRES_PASSWORD: ${SECRET_POSTGRES_PASSWORD:?set SECRET_POSTGRES_PASSWORD in production}
      POSTGRES_DB: ${POSTGRES_DB:-secure_graphrag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-graphrag} -d ${POSTGRES_DB:-secure_graphrag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Redis — required for production rate limiting
  redis:
    image: redis:7-alpine
    container_name: secure-graphrag-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${SECRET_REDIS_PASSWORD:?set SECRET_REDIS_PASSWORD in production}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SECRET_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j Graph Database Service
  neo4j:
    image: neo4j:5.20-community
    container_name: secure-graphrag-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # bind to localhost only
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${SECRET_NEO4J_PASSWORD:?set SECRET_NEO4J_PASSWORD in production}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Secure GraphRAG FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-graphrag-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # bind to localhost only
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SECRET_DATABASE_PASSWORD=${SECRET_POSTGRES_PASSWORD:?set SECRET_POSTGRES_PASSWORD in production}
      - DATABASE_URL=postgresql://graphrag:${SECRET_POSTGRES_PASSWORD:?set SECRET_POSTGRES_PASSWORD in production}@postgres:5432/secure_graphrag
      - LLM_PROVIDER=mock
      - SECRET_NEO4J_PASSWORD=${SECRET_NEO4J_PASSWORD:?set SECRET_NEO4J_PASSWORD in production}
      - NEO4J_PASSWORD=${SECRET_NEO4J_PASSWORD:?set SECRET_NEO4J_PASSWORD in production}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - SECRET_REDIS_PASSWORD=${SECRET_REDIS_PASSWORD:?set SECRET_REDIS_PASSWORD in production}
      - REDIS_URL=redis://:${SECRET_REDIS_PASSWORD:?set SECRET_REDIS_PASSWORD in production}@redis:6379/0
      - SECRET_JWT_KEY=${SECRET_JWT_KEY:?set SECRET_JWT_KEY in production}
      - JWT_SECRET_KEY=${SECRET_JWT_KEY:?set SECRET_JWT_KEY in production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_MINUTES=60
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in production}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_ENABLED=${STRIPE_ENABLED:-false}
      - SEED_DEFAULT_USERS=${SEED_DEFAULT_USERS:-false}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in production}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD:?set DEFAULT_USER_PASSWORD in production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Secure GraphRAG Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secure-graphrag-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in production}
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
