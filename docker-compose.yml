version: "3.8"

services:
  # Neo4j Graph Database Service
  neo4j:
    image: neo4j:5.20-community
    container_name: secure-graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/graphrag_secure_2024
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Secure GraphRAG FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-graphrag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LLM_PROVIDER=mock
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphrag_secure_2024
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro

volumes:
  neo4j_data:
